:root{
  --green:#00A758; --blue:#0000C1; --navy:#282B3E; --coral:#EC6453;
  --violet:#604584; --turq:#06C7BA;
  --ink:#1B1D28; --muted:#5B6070; --line:#E3E5EA; --soft:#F5F6F8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Manulife JH Sans','Segoe UI',Roboto,Arial,sans-serif;
  background:#fff; color:var(--ink); font-synthesis:none;
  -webkit-text-size-adjust:100%;
}
button,input,select{font-family:inherit}
img,svg{vertical-align:middle}
.top{
  position:sticky; top:0; z-index:30; background:#fff;
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; padding:10px 14px;
}
.mlogo{height:20px;width:auto;display:block}
.topName{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spacer{flex:1}
.chip{
  border:1px solid var(--line); border-radius:10px; padding:5px 10px;
  font-size:14px; font-weight:700; background:#fff; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  flex:0 1 auto; min-width:34px; max-width:46vw;
}
@media(max-width:560px){ .topName{display:none} }
.chip.green{background:var(--green);border-color:var(--green);color:#fff}
.langBtn{
  border:1px solid var(--line); background:#fff; border-radius:6px;
  padding:6px 9px; font-size:13px; font-weight:700; cursor:pointer; color:var(--muted);
}
.langBtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.langBtn:focus-visible,.btn:focus-visible,.pAns:focus-visible,.input:focus{
  outline:3px solid var(--blue); outline-offset:2px;
}
.net{display:none;background:var(--coral);color:#fff;text-align:center;font-size:14px;font-weight:700;padding:8px 12px}
#app{
  max-width:760px; margin:0 auto; padding:18px 14px 64px;
}
body[data-role="host"] #app{max-width:1080px}
body[data-role="none"] #app{max-width:560px}
.hero{
  background:var(--navy); color:#fff; border-radius:10px;
  padding:26px 22px; margin-bottom:16px;
}
.hero.center{text-align:center}
.eyebrow{
  font-size:13px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:rgba(255,255,255,.72); margin-bottom:8px;
}
.h1{font-size:clamp(26px,6.4vw,40px);line-height:1.12;margin:0 0 8px;font-weight:700;text-wrap:balance}
.heroSub{font-size:16px;line-height:1.5;color:rgba(255,255,255,.82);margin:0}
.h2{font-size:clamp(21px,4.6vw,28px);font-weight:700;margin:0 0 10px;text-wrap:balance;overflow-wrap:anywhere}
.h3{font-size:16px;font-weight:700;margin:0}
.sub{font-size:16px;color:var(--muted);margin:0 0 16px;line-height:1.5}
.cap{font-size:14px;color:var(--muted);margin:8px 0 0;overflow-wrap:anywhere}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.45}
.center{text-align:center}
.card{
  border:1px solid var(--line); border-radius:10px; background:#fff;
  padding:18px; margin-bottom:14px;
}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input{
  width:100%; min-height:54px; border:1px solid var(--line); border-radius:6px;
  padding:0 14px; font-size:16px; background:#fff; color:var(--ink);
}
select.input{padding-right:8px}
#inPin{font-size:34px;font-weight:700;letter-spacing:.3em;text-align:center}
.btn{
  display:flex; align-items:center; justify-content:center;
  width:100%; min-height:54px; padding:10px 20px;
  border:1px solid transparent; border-radius:6px;
  background:var(--green); color:#fff;
  font-size:17px; font-weight:700; cursor:pointer; text-align:center;
}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.navy{background:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn+.btn{margin-top:10px}
.actions{margin-top:16px}
.two{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:820px){.two{grid-template-columns:320px 1fr}}
.pinBig{
  font-size:clamp(58px,15vw,96px); font-weight:700; letter-spacing:.12em;
  line-height:1; text-align:center; margin-top:4px;
}
.pinLbl{

.badgeBig{

.empty{font-size:15px;color:var(--muted);margin:0 0 12px}
.qHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
#qNum{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pill{

.tNum{

}

.qText{font-size:clamp(20px,4.2vw,32px);line-height:1.25;margin:0 0 16px;overflow-wrap:anywhere}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pqView{min-height:calc(100vh - 131px);min-height:calc(100dvh - 131px);display:flex;flex-direction:column}

.c0{background:var(--green)}
.c1{background:var(--blue)}
.c2{background:var(--coral)}
.c3{background:var(--violet)}

}
.hAns.ok{outline:5px solid var(--navy);outline-offset:-5px}

.badge{font-size:clamp(32px,8vw,52px);font-weight:700;letter-spacing:.05em;line-height:1.1}
.pts{font-size:clamp(24px,6vw,38px);font-weight:700;margin-top:6px}

.brow .gn{font-size:15px;font-weight:700;color:var(--green);min-width:64px;text-align:right}
.brow .sc{font-size:20px;font-weight:700;color:var(--navy);min-width:74px;text-align:right}

.brow.mine{border-left:6px solid var(--green)}

.rankLine.big{font-size:clamp(20px,5vw,26px)}

    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.err || ('http' + r.status)); e.code = j.err || ''; throw e; }
      return j;
    });
  }).catch(function (e) { if (e && e.code) throw e; var x = new Error('network'); x.code = 'network'; throw x; });
}
function errMsg(code) {
  var m = { pin: 'errBadPin', name: 'errName', started: 'errStarted', full: 'errFull',
            session: 'errSession', host: 'errServer', network: 'errServer', closed: 'errTry' };
  return m[code] ? t(m[code]) : (code ? String(code) : t('errServer'));
}

/* ------------------------------------------------------------------ sound */
var AC = null;
function tone(f, ms, v) {
  if (!sess || sess.role !== 'host') return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.04, n);
    g.gain.exponentialRampToValueAtTime(0.0008, n + ms / 1000);
    o.connect(g); g.connect(AC.destination);
    o.start(n); o.stop(n + ms / 1000);
  } catch (e) {}
}
function chord(list) {
  list.forEach(function (f, i) { setTimeout(function () { tone(f, 150, 0.045); }, i * 140); });
}
function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
document.addEventListener('pointerdown', function once() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  document.removeEventListener('pointerdown', once);
});

/* ------------------------------------------------------------------ toast */
var toastT = null;
function toast(msg) {
  var el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.hidden = false;
  if (toastT) clearTimeout(toastT);
  toastT = setTimeout(function () { el.hidden = true; }, 3400);
}

/* ------------------------------------------------------------------ views */
function viewLanding() {
  return '' +
  '<div class="hero">' +
    '<div class="eyebrow">MANULIFE</div>' +
    '<h1 class="h1">' + esc(t('brandTitle')) + '</h1>' +
    '<p class="heroSub">' + esc(t('brandSub')) + '</p>' +
  '</div>' +
  '<div class="card">' +
    '<h2 class="h2">' + esc(t('joinTitle')) + '</h2>' +
    '<label class="field"><span>' + esc(t('pinLbl')) + '</span>' +
      '<input id="inPin" class="input" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="0000"></label>' +
    '<label class="field"><span>' + esc(t('nameLbl')) + '</span>' +
      '<input id="inName" class="input" maxlength="16" placeholder="' + esc(t('namePh')) + '"></label>' +
    '<button class="btn" id="btnJoin" type="button">' + esc(t('joinBtn')) + '</button>' +
  '</div>' +
  '<div class="card">' +
    '<h2 class="h2">' + esc(t('hostQ')) + '</h2>' +
    '<p class="sub">' + esc(t('hostSub')) + '</p>' +
    '<button class="btn navy" id="btnHostNew" type="button">' + esc(t('hostBtn')) + '</button>' +
  '</div>';
}

function hostCells(q, reveal) {
  var opts = qOpts(q);
  return opts.map(function (txt, i) {
    var cls = 'hAns c' + i + (reveal && i === q.correct ? ' ok' : '');
    var inner = SHAPES[i] + '<span class="ansTxt">' + esc(txt) + '</span>';
    if (reveal) inner += '<span class="cnt">' + q.counts[i] + '</span>';
    return '<div class="' + cls + '">' + inner + '</div>';
  }).join('');
}
function playerBtns(q, state) {
  var opts = qOpts(q);
  var answered = state === 'locked' || state === 'reveal';
  return opts.map(function (txt, i) {
    var cls = 'pAns c' + i;
    if (state === 'locked') cls += (i === localPick ? ' picked' : '');
    if (state === 'reveal') cls += (i === q.correct ? ' ok' : ' dim');
    return '<button type="button" class="' + cls + '" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' +
      SHAPES[i] + '<span>' + esc(txt) + '</span></button>';
  }).join('');
}
function qNumLbl(s) {
  return t('qOf').replace('{n}', String(s.qIndex + 1)).replace('{t}', String(s.total));
}
function rowsHtml(rows, mineName, cap) {
  var out = '', list = rows || [];
  if (!list.length) out += '<p class="empty">' + esc(t('emptyBoard')) + '</p>';
  list.slice(0, cap || 20).forEach(function (r) {
    out += '<div class="brow' + (r.rank === 1 ? ' top' : '') + (mineName && r.name === mineName ? ' mine' : '') + '">' +
      '<span class="rk">' + r.rank + '</span>' +
      '<span class="nm">' + esc(r.name) + '</span>' +
      '<span class="gn">+' + r.gain + '</span>' +
      '<span class="sc">' + r.score + '</span></div>';
  });
  return out;
}
function podiumHtml(rows, cap) {
  var top = (rows || []).slice(0, cap || 3);
  var order = [1, 0, 2];   // visual: 2nd, 1st, 3rd
  return '<div class="podium" id="podium">' + order.map(function (idx) {
    var r = top[idx];
    if (!r) return '';
    return '<div class="pod p' + (idx + 1) + '"><div class="rk">#' + r.rank + '</div>' +
      '<div class="nm">' + esc(r.name) + '</div><div class="sc">' + r.score + ' ' + esc(t('ptsLbl')) + '</div></div>';
  }).join('') + '</div>';
}

function viewHost(s) {
  if (s.phase === 'lobby') {
    var durOpts = [10, 20, 30, 45, 60].map(function (d) {
      return '<option value="' + d + '"' + (Number(s.duration) === d ? ' selected' : '') + '>' + d + '</option>';
    }).join('');
    var names = (s.names || []).map(function (n) {
      return '<span class="chipName">' + esc(n) + '</span>';
    }).join('');
    var joinUrl = location.origin + '/?pin=' + s.pin;
    return '' +
    '<div class="hero">' +
      '<div class="eyebrow">' + esc(t('lobbyEyebrow')) + '</div>' +
      '<div class="pinBig" id="pinBig">' + esc(s.pin) + '</div>' +
      '<div class="pinLbl">' + esc(t('pinLbl')) + '</div>' +
    '</div>' +
    '<div class="two">' +
      '<div class="card center">' +
        '<div class="qrBox"><img id="qrImg" src="/api/qr?data=' + encodeURIComponent(joinUrl) + '" width="210" height="210" alt="' + esc(t('qrAlt')) + '"></div>' +
        '<p class="cap" id="joinUrl">' + esc(t('joinLink')) + ': ' + esc(joinUrl) + '</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="rowSpace"><span class="h3">' + esc(t('playersIn')) + '</span>' +
          '<span class="badgeBig" id="lobbyCount">' + s.count + '</span></div>' +
        '<div class="chips" id="lobbyNames">' + (names || '<span class="empty">' + esc(t('noPlayers')) + '</span>') + '</div>' +
        '<label class="field"><span>' + esc(t('durLbl')) + '</span>' +
          '<select id="selDur" class="input">' + durOpts + '</select></label>' +
        '<button class="btn" id="btnStart" type="button">' + esc(t('startBtn')) + '</button>' +
        '<p class="hint">' + esc(s.count ? t('startReady') : t('startWait')) + '</p>' +
      '</div>' +
    '</div>';
  }
  if (s.phase === 'question' && s.q) {
    return '' +
    '<div class="qHead"><span id="qNum">' + esc(qNumLbl(s)) + '</span>' +
      '<span class="pill">' + esc(t('answeredLbl')) + ': <b id="answeredNum">' + s.answered + '/' + s.count + '</b></span></div>' +
    '<div class="tWrap"><div class="tNum" id="timerNum">0</div><div class="tBar"><i id="timerBar"></i></div></div>' +
    '<h2 class="qText" id="qText">' + esc(qText(s.q)) + '</h2>' +
    '<div class="grid4">' + hostCells(s.q, false) + '</div>' +
    '<div class="actions"><button class="btn ghost" id="btnClose" type="button">' + esc(t('closeBtn')) + '</button></div>';
  }
  if (s.phase === 'reveal' && s.q) {
    return '' +
    '<div class="qHead"><span id="qNum">' + esc(qNumLbl(s)) + '</span>' +
      '<span class="pill okPill">' + esc(t('revealLbl')) + '</span></div>' +
    '<h2 class="qText" id="qText">' + esc(qText(s.q)) + '</h2>' +
    '<div class="grid4">' + hostCells(s.q, true) + '</div>' +
    '<div class="actions"><button class="btn" id="btnBoard" type="button">' + esc(t('boardBtn')) + '</button></div>';
  }
  if (s.phase === 'board') {
    var isLast = s.qIndex + 1 >= s.total;
    return '' +
    '<div class="qHead"><span class="h3" style="font-size:20px">' + esc(t('boardTitle')) + '</span>' +
      '<span class="pill">' + esc(qNumLbl(s)) + '</span></div>' +
    '<div id="boardRows">' + rowsHtml(s.board, null, 20) + '</div>' +
    '<div class="actions"><button class="btn" id="btnNext" type="button">' + esc(isLast ? t('finalBtn') : t('nextBtn')) + '</button></div>';
  }
  if (s.phase === 'final') {
    return '' +
    '<div class="hero center"><div class="eyebrow">' + esc(t('finalTitle')) + '</div></div>' +
    podiumHtml(s.board, 3) +
    '<div id="finalRows">' + rowsHtml(s.board, null, 20) + '</div>' +
    '<div class="actions"><button class="btn navy" id="btnRestart" type="button">' + esc(t('restartBtn')) + '</button></div>';
  }
  return '<div class="card center"><p class="sub">' + esc(t('loading')) + '</p></div>';
}

function viewPlayer(s) {
  if (s.phase === 'lobby') {
    return '' +
    '<div class="hero center">' +
      '<div class="eyebrow">' + esc(t('youIn')) + '</div>' +
      '<div class="scoreBig" id="myName">' + esc(s.me.name) + '</div>' +
      '<p class="heroSub" id="waitTxt">' + esc(t('waitHost')) + '</p>' +
    '</div>' +
    '<div class="card center">' +
      '<div class="bigCount">' + s.count + '</div>' +
      '<p class="cap">' + esc(t('playersIn')) + '</p>' +
    '</div>';
  }
  if (s.phase === 'question' && s.q) {
    var picked = (localQ === s.qIndex && localPick >= 0) || s.me.answered;
    return '' +
    '<div class="pqView">' +
    '<div class="qHead"><span id="qNum">' + esc(qNumLbl(s)) + '</span></div>' +
    '<div class="tWrap"><div class="tNum" id="timerNum">0</div><div class="tBar"><i id="timerBar"></i></div></div>' +
    '<h2 class="qText" id="pqText">' + esc(qText(s.q)) + '</h2>' +
    '<div class="grid4" id="pGrid">' + playerBtns(s.q, picked ? 'locked' : 'open') + '</div>' +
    (picked ? '<div class="locked" id="locked">' + esc(t('lockedTxt')) + '</div>' : '') +
    '</div>';
  }
  if (s.phase === 'reveal' && s.q) {
    var res = s.result || { ok: false, pts: 0, timeout: true };
    var correctTxt = qOpts(s.q)[s.q.correct];
    var badge = res.timeout ? t('timeout') : (res.ok ? t('correct') : t('wrong'));
    return '' +
    '<div class="qHead"><span id="qNum">' + esc(qNumLbl(s)) + '</span></div>' +
    '<div class="res ' + (res.ok ? 'ok' : 'bad') + '">' +
      '<div class="badge" id="resBadge">' + esc(badge) + '</div>' +
      '<div class="pts" id="resPts">' + (res.ok ? '+' + res.pts : '0') + ' ' + esc(t('ptsLbl')) + '</div>' +
      '<div class="corr" id="resCorrect">' + esc(t('correctAns')) + ': ' + esc(correctTxt) + '</div>' +
      (s.me.streak > 1 ? '<div class="streak">' + esc(t('streakLbl')) + ': ' + s.me.streak + '</div>' : '') +
    '</div>' +
    '<div class="grid4" id="pGrid">' + playerBtns(s.q, 'reveal') + '</div>' +
    '<div class="scoreLine">' + esc(t('yourScore')) + ': <b>' + s.me.score + '</b></div>';
  }
  if (s.phase === 'board') {
    return '' +
    '<div class="hero center"><div class="eyebrow">' + esc(t('boardTitle')) + '</div></div>' +
    '<div id="pBoard">' + rowsHtml(s.board, s.me.name, 10) + '</div>' +
    (s.myRank ? '<div class="rankLine" id="myRank">' + esc(t('yourRank')) + ' #' + s.myRank + '</div>' : '') +
    '<p class="hint center">' + esc(t('waitHostNext')) + '</p>';
  }
  if (s.phase === 'final') {
    return '' +
    '<div id="pFinal">' +
      '<div class="hero center"><div class="eyebrow">' + esc(t('finalTitle')) + '</div></div>' +
      podiumHtml(s.board, 3) +
      '<div id="pBoard">' + rowsHtml(s.board, s.me.name, 10) + '</div>' +
      (s.myRank ? '<div class="rankLine big">' + esc(t('yourRank')) + ' #' + s.myRank + '</div>' : '') +
      '<p class="hint center">' + esc(t('waitNewRound')) + '</p>' +
    '</div>';
  }
  return '<div class="card center"><p class="sub">' + esc(t('loading')) + '</p></div>';
}

/* ------------------------------------------------------------------ render */
function keyOf(s) {
  if (!sess) return 'land:' + lang;
  if (!s) return 'load:' + lang;
  var b = (s.board || []).map(function (r) { return r.rank + ':' + r.name + ':' + r.score + ':' + r.gain; }).join(',');
  return [s.role, s.phase, s.qIndex, s.count, s.answered,
    s.me && s.me.name, s.me && s.me.score, s.me && s.me.answered,
    s.me && s.me.result && (s.me.result.ok + '|' + s.me.result.pts + '|' + s.me.result.timeout),
    s.myRank, b, (s.names || []).join(','), (s.duration), lang].join('#');
}
function paintHeader() {
  $('#topName').textContent = t('tag');
  $('#langVI').setAttribute('aria-pressed', lang === 'vi' ? 'true' : 'false');
  $('#langEN').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
  var chip = $('#pinChip');
  if (!sess) { chip.hidden = true; }
  else {
    chip.hidden = false;
    if (sess.role === 'host') chip.textContent = 'PIN ' + (S ? S.pin : sess.pin);
    else chip.textContent = (S && S.me ? S.me.name + ' · ' + S.me.score : (sess.name || '')) + '';
  }
}
function render() {
  paintHeader();
  var k = keyOf(S);
  if (k === lastKey) { tick(); return; }
  lastKey = k;
  var role = sess ? sess.role : 'none';
  document.body.dataset.role = role;
  var app = $('#app');
  if (!sess) app.innerHTML = viewLanding();
  else if (!S) app.innerHTML = '<div class="card center"><p class="sub">' + esc(t('loading')) + '</p></div>';
  else app.innerHTML = (role === 'host') ? viewHost(S) : viewPlayer(S);
  wire();
  tick();
}
function wire() {
  if (!sess) {
    var pin = $('#inPin'), nm = $('#inName'), jn = $('#btnJoin'), hs = $('#btnHostNew');
    if (pendingPin && pin) { pin.value = pendingPin; pendingPin = ''; }
    if (jn) jn.onclick = doJoin;
    if (hs) hs.onclick = doHostNew;
    if (pin) {
      pin.oninput = function () { pin.value = pin.value.replace(/\D/g, '').slice(0, 4); };
      pin.onkeydown = function (e) { if (e.key === 'Enter' && nm) nm.focus(); };
    }
    if (nm) nm.onkeydown = function (e) { if (e.key === 'Enter') doJoin(); };
    return;
  }
  if (sess.role === 'host' && S) {
    var st = $('#btnStart'); if (st) st.onclick = function () { doAction('start'); };
    var sd = $('#selDur'); if (sd) sd.onchange = function () { doAction('duration', Number(sd.value)); };
    var cl = $('#btnClose'); if (cl) cl.onclick = function () { doAction('close'); };
    var bd = $('#btnBoard'); if (bd) bd.onclick = function () { doAction('board'); };
    var nx = $('#btnNext'); if (nx) nx.onclick = function () { doAction('next'); };
    var rs = $('#btnRestart'); if (rs) rs.onclick = function () { doAction('restart'); };
    return;
  }
  if (sess.role === 'player' && S) {
    Array.prototype.forEach.call(document.querySelectorAll('.pAns'), function (b) {
      b.onclick = function () { doAnswer(Number(b.getAttribute('data-i'))); };
    });
  }
}

/* ---------------------------------------------------------------- actions */
function doJoin() {
  var pin = ($('#inPin').value || '').replace(/\D/g, '');
  var name = ($('#inName').value || '');
  if (pin.length !== 4) { toast(t('errPin')); return; }
  if (!name.trim()) { toast(t('errName')); $('#inName').focus(); return; }
  var btn = $('#btnJoin'); if (btn) btn.disabled = true;
  api('/api/join', { pin: pin, name: name })
    .then(function (j) {
      sess = { role: 'player', pin: j.pin, token: j.token, name: j.name };
      saveSess(); S = null; lastKey = ''; connect();
    })
    .catch(function (e) { toast(errMsg(e.code)); })
    .then(function () { var b = $('#btnJoin'); if (b) b.disabled = false; });
}
function doHostNew() {
  var btn = $('#btnHostNew'); if (btn) btn.disabled = true;
  api('/api/host/new', { origin: location.origin })
    .then(function (j) {
      sess = { role: 'host', pin: j.pin, token: j.token };
      saveSess(); S = null; lastKey = ''; connect();
    })
    .catch(function (e) { toast(errMsg(e.code)); })
    .then(function () { var b = $('#btnHostNew'); if (b) b.disabled = false; });
}
function doAction(action, seconds) {
  api('/api/action', { pin: sess.pin, token: sess.token, action: action, seconds: seconds })
    .catch(function (e) { toast(errMsg(e.code)); });
}
function doAnswer(i) {
  if (!S || S.phase !== 'question' || (S.me && S.me.answered)) return;
  if (localQ === S.qIndex && localPick >= 0) return;
  localQ = S.qIndex; localPick = i;
  vib(25);
  render();
  api('/api/answer', { pin: sess.pin, token: sess.token, c: i })
    .catch(function (e) {
      localPick = -1; localQ = -1;
      toast(errMsg(e.code));
      render();
    });
}

/* ------------------------------------------------------------------ ticker */
function tick() {
  var num = $('#timerNum'), bar = $('#timerBar');
  if (!num || !S || S.phase !== 'question' || !S.deadline) return;
  var total = (S.qTime || S.duration || 20) * 1000;
  var left = Math.max(0, S.deadline - (Date.now() + skew));
  num.textContent = String(Math.ceil(left / 1000));
  if (bar) bar.style.width = Math.max(0, Math.min(100, (left / total) * 100)) + '%';
  var secs = Math.ceil(left / 1000);
  if (sess && sess.role === 'host' && secs >= 1 && secs <= 3 && secs !== lastBeep) {
    lastBeep = secs;
    tone(880, 110, 0.05);
  }
  if (secs === 0) lastBeep = 0;
}
setInterval(tick, 200);

/* ---------------------------------------------------------------- boot */
$('#langVI').onclick = function () { lang = 'vi'; try { localStorage.setItem('mq_lang', 'vi'); } catch (e) {} lastKey = ''; render(); };
$('#langEN').onclick = function () { lang = 'en'; try { localStorage.setItem('mq_lang', 'en'); } catch (e) {} lastKey = ''; render(); };
render();
if (sess) connect();
})();
</script>
</body>
</html>
